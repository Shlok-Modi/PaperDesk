<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — PaperDesk</title>
  <link rel="icon" type="image/png" href="assets/download (2).png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
</head>

<body class="auth-body">

  <header class="navbar">
    <div class="nav-inner">
      <a href="landing.html" class="brand">
        <span class="brand-mark">
          <img src="assets/download (1).png" alt="PaperDesk Logo">
        </span>

        <div class="brand-text">
          <span class="brand-name">PaperDesk</span>
          <span class="brand-tagline">Learn Before You Earn</span>
        </div>
      </a>
      <div class="nav-actions" style="margin-left:auto;">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon sun">☀</span>
          <span class="theme-icon moon">◑</span>
        </button>
      </div>
    </div>
  </header>

  <div class="auth-layout" style="grid-template-columns: 1fr;">
    <div class="auth-right">
      <div class="auth-card">
        <h2 style="font-size:20px; font-weight:600; margin-bottom:6px;">Set a new password</h2>
        <p class="stat-sub" style="margin-bottom:20px;">Code verified — choose a new password for your account.</p>

        <form class="auth-form" id="resetForm">
          <div class="form-group">
            <label class="form-label" for="resetPassword">New Password</label>
            <div class="input-wrap">
              <input class="form-input" type="password" id="resetPassword" placeholder="Min. 8 characters" minlength="8"
                required />
              <button type="button" class="eye-btn" data-target="resetPassword">
                <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
                  <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.5" />
                  <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5" />
                </svg>
              </button>
            </div>
            <!-- Password requirements checklist -->
            <ul class="pw-rules" id="resetPwRules">
              <li id="resetRuleLen" data-rule="len">At least 8 characters</li>
              <li id="resetRuleUpper" data-rule="upper">One uppercase letter</li>
              <li id="resetRuleNumber" data-rule="number">One number</li>
              <li id="resetRuleSpecial" data-rule="special">One special character (e.g. ! @ # $)</li>
            </ul>
          </div>
          <div class="form-group">
            <label class="form-label" for="resetConfirm">Confirm New Password</label>
            <div class="input-wrap">
              <input class="form-input" type="password" id="resetConfirm" placeholder="••••••••" required />
              <button type="button" class="eye-btn" data-target="resetConfirm">
                <svg viewBox="0 0 20 20" fill="none" width="16" height="16">
                  <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.5" />
                  <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-error" id="resetError"></div>
          <div class="form-error" id="resetSuccess"
            style="display:none; color:var(--positive); background:rgba(0,200,150,0.08); border-color:rgba(0,200,150,0.25);">
          </div>

          <button type="submit" class="btn-auth" id="resetBtn">
            <span class="btn-auth-text">Reset Password</span>
            <span class="btn-auth-spinner" id="resetSpinner"></span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="reset-password.js"></script>
</body>

</html>
