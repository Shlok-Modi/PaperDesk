<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — PaperDesk</title>
  <link rel="icon" type="image/png" href="assets/download (2).png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
</head>

<body class="auth-body">

  <header class="navbar">
    <div class="nav-inner">
      <a href="landing.html" class="brand">
        <span class="brand-mark">
          <img src="assets/download (1).png" alt="PaperDesk Logo">
        </span>

        <div class="brand-text">
          <span class="brand-name">PaperDesk</span>
          <span class="brand-tagline">Learn Before You Earn</span>
        </div>
      </a>
      <div class="nav-actions" style="margin-left:auto;">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon sun">☀</span>
          <span class="theme-icon moon">◑</span>
        </button>
      </div>
    </div>
  </header>

  <div class="auth-layout" style="grid-template-columns: 1fr;">
    <div class="auth-right">
      <div class="auth-card">
        <h2 style="font-size:20px; font-weight:600; margin-bottom:6px;">Reset your password</h2>
        <p class="stat-sub" style="margin-bottom:20px;">Enter the email on your account and we'll send you a reset link.
        </p>

        <form class="auth-form" id="forgotForm">
          <div class="form-group">
            <label class="form-label" for="forgotEmail">Email</label>
            <input class="form-input" type="email" id="forgotEmail" placeholder="you@example.com" required />
          </div>

          <div class="form-error" id="forgotError"></div>
          <div class="form-error" id="forgotSuccess"
            style="display:none; color:var(--positive); background:rgba(0,200,150,0.08); border-color:rgba(0,200,150,0.25);">
          </div>

          <button type="submit" class="btn-auth" id="forgotBtn">
            <span class="btn-auth-text">Send Reset Link</span>
            <span class="btn-auth-spinner" id="forgotSpinner"></span>
          </button>

          <p class="auth-switch">
            Remembered it? <a href="login.html" class="form-link">Back to sign in</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="forgot-password.js"></script>
</body>

</html>
